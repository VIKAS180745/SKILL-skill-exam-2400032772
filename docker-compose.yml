
services:

  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    environment:
      POSTGRES_DB: skill_exam_2400032772
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_exam_2400032772"]
      interval: 10s
      timeout: 5s
      retries: 5

  exam-service:
    image: docker-skill-exam-2400032772:latest
    build:
      context: ./ATMManagement
      dockerfile: Dockerfile
    container_name: exam-service
    ports:
      - "2772:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill_exam_2400032772
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      postgresdb:
        condition: service_healthy

volumes:
  postgres_data:
